name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travescout_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Write test env
        run: |
          cat > .env.test <<'ENV'
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/travescout_test
          JWT_ACCESS_SECRET=ci_access_secret
          JWT_REFRESH_SECRET=ci_refresh_secret
          JWT_ACCESS_EXPIRES_IN=15m
          JWT_REFRESH_EXPIRES_IN=7d
          STRIPE_SECRET_KEY=sk_test_ci_placeholder
          ENV
      - name: Run migrations
        run: |
          for f in migrations/*.sql; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d travescout_test -f "$f"
          done
      - run: npm run lint
      - run: npm test
      - name: Audit (fails on moderate+)
        run: npm audit --audit-level=moderate

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Audit (advisory only — Expo SDK 54 toolchain carries known moderates)
        run: npm audit --audit-level=moderate
        continue-on-error: true
